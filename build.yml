name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          set -e
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/com/wasel7/app proj/app/src/main/res/values proj/app/src/main/res/drawable proj/app/src/main/res/mipmap-anydpi-v26
          cp index.html proj/app/src/main/assets/index.html
          cd proj
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Wasel7"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.wasel7.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.wasel7.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:label="واصل 7"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|layoutDirection"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/wasel7/app/MainActivity.java <<'EOF'
          package com.wasel7.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView web;
              private int nid = 100;
              private static final String CH = "orders";
              private static final String HOME = "aattia201818-creator.github.io";

              public class Bridge {
                  @JavascriptInterface
                  public void show(String title, String body) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          Intent i = new Intent(MainActivity.this, MainActivity.class);
                          i.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          Notification n = new Notification.Builder(MainActivity.this, CH)
                              .setSmallIcon(R.drawable.ic_fg)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setStyle(new Notification.BigTextStyle().bigText(body))
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .build();
                          nm.notify(nid++, n);
                      } catch (Exception ignored) {}
                  }
              }

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  NotificationChannel ch = new NotificationChannel(CH, "طلبات واصل 7", NotificationManager.IMPORTANCE_HIGH);
                  ch.enableVibration(true);
                  ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);

                  List<String> need = new ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      need.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      need.add("android.permission.POST_NOTIFICATIONS");
                  }
                  if (!need.isEmpty()) requestPermissions(need.toArray(new String[0]), 1);

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setTextZoom(100);
                  web.addJavascriptInterface(new Bridge(), "WaselApp");
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          cb.invoke(origin, origin != null && origin.contains(HOME), false);
                      }
                  });
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String h = u.getHost(); if ("file".equals(u.getScheme()) || HOME.equals(h)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  if (b == null) web.loadUrl("https://aattia201818-creator.github.io/Wasel7/");
                  else web.restoreState(b);
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }

              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#0F1F3D</item>
                  <item name="android:navigationBarColor">#0F1F3D</item>
                  <item name="android:windowBackground">#0F1F3D</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M30,34 L78,34 L78,43 L54,80 L43,80 L64,43 L30,43 Z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0F1F3D" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Wasel7-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
