<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>واصل 7</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--navy:#0f1f3d;--navy2:#1b2f55;--blue:#0a2a6b;--bg:#f3f5f9;--ink:#101828;--mute:#667085;--line:#e4e7ec;--bad:#dc2626}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Cairo,Tahoma,system-ui,sans-serif;background:var(--navy);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid #6b8cff;outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-height:100vh}
#login{background:#fff;padding:24px;display:flex;flex-direction:column;min-height:100vh}
.logo{display:block;margin:4px auto 0;width:190px}
h1{font-size:28px;font-weight:800;color:var(--blue);text-align:center;margin-top:12px}
.sub{color:var(--mute);text-align:center;margin:4px 0 18px}
label{display:block;font-weight:600;margin:12px 0 6px}
.field{display:flex;align-items:center;gap:10px;background:#f3f4f6;border:2px solid transparent;border-radius:16px;padding:0 16px;height:54px}
.field:focus-within{border-color:var(--blue);background:#fff}
.field input,.field select{flex:1;border:0;background:transparent;height:100%;outline:0;min-width:0;text-align:right}
.field input[dir=ltr]{text-align:left}
.cc{font-weight:700;color:var(--mute);padding-inline-end:10px;border-inline-end:1px solid #d0d5dd}
.eye,.link{background:none;font-weight:600;color:var(--blue);font-size:14px;padding:6px 0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.btn{width:100%;height:54px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;font-size:17px;box-shadow:0 10px 20px -8px rgba(15,31,61,.5)}
.btn:active{transform:scale(.98)}
.seg{display:flex;gap:6px;background:#f3f4f6;border-radius:16px;padding:4px}
.seg button{flex:1;height:42px;border-radius:12px;background:none;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--navy);color:#fff}
.foot{margin-top:auto;text-align:center;color:var(--mute);padding-top:20px;font-size:14px}
#app{padding:16px 16px 32px;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid #ffffff2b}
.brand b{font-size:25px;font-weight:800}
.brand small{display:block;color:#cbd5e6;font-size:13px}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;background:#16a34a2e;color:#4ade80;font-weight:600}
.chip.off{background:#dc26262e;color:#f87171}
.out{background:#ffffff1a;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;margin-inline-start:8px}
.hi{font-size:24px;font-weight:800;margin:18px 0 12px}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:16px;margin-top:12px}
.card h2{font-size:17px;font-weight:800}
.card>p{color:var(--mute);font-size:14px;margin:6px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--navy2);border-radius:18px;padding:12px 14px;color:#fff}
.stat span{color:#cbd5e6;font-size:13px}
.stat b{display:block;font-size:28px;font-weight:800;margin-top:4px}
.list{display:grid;gap:10px;margin-top:12px}
.empty{text-align:center;color:var(--mute);padding:18px 0}
.order{border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order small{color:var(--mute);display:block;margin-top:2px}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.s-search{background:#fef3c7;color:#92400e}.s-assigned,.s-way{background:#dbeafe;color:#1e40af}.s-done,.s-retok{background:#dcfce7;color:#166534}.s-cancel{background:#fee2e2;color:#991b1b}.s-returned{background:#ffedd5;color:#9a3412}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{flex:1;min-width:90px;height:38px;border-radius:10px;background:#eef2f7;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.mini.ok{background:var(--navy);color:#fff}.mini.danger{color:var(--bad)}.mini.map{background:#e0ecff;color:#1e40af}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.tabs button{white-space:nowrap;background:#ffffff1a;color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.tabs button.on{background:#fff;color:var(--navy)}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.sw .hi{margin:0}
.sw button{background:#ffffff1a;color:#fff;border-radius:99px;padding:8px 16px;font-weight:700}
.sw button.on{background:#16a34a}
.inl{display:flex;gap:8px;margin-top:8px}
.inl input,.inl select{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.reply{background:#f0f9ff;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.bg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
.bg.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:20px;font-weight:800}
.sheet textarea{width:100%;background:#f3f4f6;border:2px solid transparent;border-radius:16px;padding:12px 16px;min-height:80px;resize:none;outline:0}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90%}
.toast.on{opacity:1}
.hide{display:none!important}
.pm{height:240px;border-radius:16px;margin-top:8px;position:relative;z-index:0;isolation:isolate}.leaflet-container{font-family:inherit}
#nav{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
#nav .nb{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;z-index:2}
#nmap{flex:1;position:relative;z-index:0}
.order{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.oh{display:flex;align-items:center;gap:10px}
.ico{width:40px;height:40px;border-radius:12px;background:#e0ecff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.oht{flex:1;min-width:0}.oht b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.oht small{display:block;color:var(--mute);font-size:12px;margin:0}
.ob{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:grid;gap:6px;font-size:14px}
.oa{color:var(--mute);font-size:13px;line-height:1.5}
.om{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.om>div{background:#f3f5f9;border-radius:12px;padding:8px 12px}.om span{font-size:12px;color:var(--mute);display:block}.om b{font-size:20px;font-weight:800}.om b.g{color:#15803d}.om i{font-size:13px;font-weight:600;font-style:normal}
.oc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.oc span{background:#f3f5f9;color:#475467;font-size:12px;padding:4px 10px;border-radius:99px}
.order .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.order .acts>*{min-width:0}
.order .acts .mini{height:42px;border-radius:10px}.order .acts .mini.ok{grid-column:1/-1;height:48px;font-size:16px;border-radius:12px}
.order .acts>.inl{grid-column:1/-1}
.stat{background:#fff;color:var(--ink)}.stat span{color:var(--mute)}.stat b{color:var(--navy)}
.feebox{background:#eef6ff;color:#1e40af;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:600}

.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
#app.lt{padding:0 0 88px;background:var(--bg);color:var(--ink);min-height:100vh}
.hd{background:var(--navy);color:#fff;padding:16px 16px 58px}.hd.sm{padding-bottom:18px}
.hd .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.who>div:last-child{min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--navy2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.who b{display:block;font-size:16px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:#cbd5e6;font-size:12px}
.hr{display:flex;align-items:center;gap:8px;flex:none}.hr .out{margin:0}
.hd .hi{font-size:22px;margin:18px 0 2px}.hd .hs{color:#cbd5e6;font-size:13px}.hd .big{font-size:32px;font-weight:800;line-height:1.25}
.tg{display:flex;align-items:center;gap:8px;background:#ffffff1f;color:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px}
.tg i{width:8px;height:8px;border-radius:50%;background:#fff}.tg.on{background:#16a34a}
.bd{padding:0 14px;margin-top:-34px}.bd.sm{margin-top:14px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp{background:#fff;border-radius:18px;padding:12px 14px;border:1px solid var(--line);min-width:0}
.kp .t{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.kp .t i{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.kp b{display:block;font-size:28px;font-weight:800;color:var(--navy);margin-top:4px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px;text-align:right}
.cta b{display:block;font-size:17px;font-weight:800}.cta small{display:block;color:#cbd5e6;font-size:12px;margin-top:4px;line-height:1.5}
.cta .plus{width:46px;height:46px;border-radius:14px;background:#f59e0b;color:#3b2300;display:flex;align-items:center;justify-content:center;flex:none;font-size:24px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.sec b{font-size:16px;font-weight:800}
.lk{background:none;color:#1e40af;font-size:13px;font-weight:600}
.cnt{font-size:12px;font-weight:700;background:#dcfce7;color:#166534;padding:2px 10px;border-radius:99px}
.bn{position:fixed;bottom:0;left:0;right:0;z-index:4;max-width:520px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);font-weight:600}
.bn button .ic{width:22px;height:22px}.bn button.on{color:var(--navy);font-weight:800}
.ico{color:#1e40af}.ico.sh{background:#fef3c7;color:#92400e}
.pg{display:flex;gap:4px;margin-top:12px}.pg i{flex:1;height:5px;border-radius:3px;background:var(--line)}.pg i.dn{background:#16a34a}.pg i.cu{background:#2563eb}
.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}.pl .on{color:#1e40af;font-weight:700}
.rt{display:flex;gap:12px;margin-top:12px}.rl{display:flex;flex-direction:column;align-items:center;padding-top:5px}
.rl .d1,.rl .d2{width:11px;height:11px;border-radius:50%;flex:none}.rl .d1{background:var(--navy)}.rl .d2{background:#f59e0b}
.rl .ln{flex:1;border-inline-start:2px dashed #b4bccb;margin:3px 0}
.rx{flex:1;display:flex;flex-direction:column;gap:10px;font-size:13px;min-width:0}.rx span{display:block;color:var(--mute);font-size:11px}
.mini .ic{margin-inline-end:4px}.oa .ic,.oc .ic{width:14px;height:14px}.ico .ic{width:20px;height:20px}
.empty .ic{width:32px;height:32px;stroke:#98a2b3}
.wt{text-align:center;padding:22px 16px}.wt b{display:block;font-size:15px;font-weight:800}.wt p{color:var(--mute);font-size:12px;line-height:1.6;margin:4px 0 12px}
.wt .oc{justify-content:center}
.rd{position:relative;width:104px;height:104px;margin:0 auto 12px}.rd span{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rd span:nth-child(1){inset:0;background:#e0ecff}.rd span:nth-child(2){inset:16px;background:#c7dcfb}.rd span:nth-child(3){inset:32px;background:var(--navy);color:#fff;font-size:22px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

#login{padding:0;background:var(--navy);min-height:100vh}
.lh{text-align:center;color:#fff;padding:30px 24px 64px}
#login .logo{width:210px;margin:0 auto;display:block}
#login .lh h1{color:#fff;font-size:23px;margin-top:14px}
#login .lh .sub{color:#cbd5e6;font-size:13px;margin:6px 0 0}
.ls{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:30px 30px 0 0;margin-top:-34px;padding:22px 20px 20px;position:relative}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
#login .field .ic{color:#98a2b3;width:18px;height:18px}.field:focus-within .ic{color:var(--blue)}
#login label{font-size:13px;margin:16px 2px 7px}
.sp{margin-top:auto;padding-top:0;display:flex;align-items:center;gap:12px;background:#f1f5fb;border-radius:16px;padding:12px 14px;font-size:12px;color:#475467;line-height:1.7}
.sp i{width:36px;height:36px;border-radius:11px;background:#e0ecff;color:#1e40af;display:flex;align-items:center;justify-content:center;flex:none}.sp b{color:var(--navy)}
#lf{margin-bottom:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    const right=`<button class="tg ${avail?'on':''}" data-a="avail"><i></i>${avail?'متاح':'غير متاح'}</button><button class="out" data-a="logout">خروج</button>`;
    A.innerHTML=hdr('تطبيق المندوب • '+vh,'<div class="hs" style="margin-top:18px">أجرتك اليوم</div><div class="big">'+money(earn)+'</div>',home,right)+`<div class="bd${home?'':' sm'}">${body}</div>`+nav([['home','الرئيسية','home'],['orders','طلباتي','list'],['money','أرباحي','wallet'],['support','الدعم','chat']]);
  }else{
    const us=C.users.filter(u=>u.role!=='admin'),cs=us.filter(u=>u.role==='courier'),done=O.filter(o=>o.s==='done'),rt=O.filter(o=>['returned','retok'].includes(o.s)),tk=C.tickets.slice().sort((a,b)=>b.t-a.t),openT=tk.filter(k=>k.open).length;
    const T=[['orders','الطلبات'],['accounts','الحسابات'],['money','الحسابات المالية'],['returns','المرتجعات'],['support','الدعم'+(openT?` (${openT})`:'')]];
    let body='';
    if(tab==='orders')body=`<section class="card"><h2>كل الطلبات (${O.length})</h2><div class="list">${O.length?O.slice().sort((a,b)=>b.t-a.t).slice(0,50).map(o=>card(o,o.s==='search'?(cs.length?`<div class="inl" style="width:100%"><select id="c${o.id}">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="mini ok" style="flex:0 0 auto" data-a="assign" data-i="${o.id}">تعيين</button></div>`:'')+B('cancel',o.id,'إلغاء','danger'):trk(o))).join(''):empty}</div></section>`;
    if(tab==='accounts')body=`<section class="card"><h2>الحسابات</h2><p>أنشئ حساب لكل محل ومندوب، وسلّمه الرقم وكلمة المرور.</p><button class="btn" data-a="newuser">+ حساب جديد</button><div class="list">${us.length?us.map(u=>`<div class="order"><div class="r1"><b>${esc(u.name)}</b><span class="st s-assigned">${u.role==='shop'?'محل':'مندوب'}</span></div><small dir="ltr" style="text-align:right">${esc(u.phone||'')}</small>${u.role==='courier'?`<small>${VH[u.veh]||'المركبة مش محددة'}</small>`:`<small>${u.loc?'📍 الموقع محدد':'⚠️ الموقع مش محدد'}</small>`}<div class="acts">${u.role==='courier'?B('cycveh',u.id,'🔄 المركبة'):B('editloc',u.id,'📍 الموقع')}${B('deluser',u.id,'حذف الحساب','danger')}</div></div>`).join(''):empty}</div></section>`;
    if(tab==='money'){const s=S(),tc=sum(done,o=>o.v),pay=sum(done,o=>s.pay+(o.ex||0)),rev=sum(done,o=>o.fee||s.fee)-pay;
      body=`<div class="stats"><div class="stat"><span>توصيلات مكتملة</span><b>${done.length}</b></div><div class="stat"><span>إجمالي التحصيل</span><b style="font-size:20px">${money(tc)}</b></div><div class="stat"><span>أجور المناديب</span><b style="font-size:20px">${money(pay)}</b></div><div class="stat"><span>صافي الإدارة</span><b style="font-size:20px">${money(rev)}</b></div></div>
      <section class="card"><h2>الأسعار</h2><div class="inl"><input id="fee" inputmode="decimal" value="${s.fee}" aria-label="أجرة التوصيل على المحل"><input id="pay" inputmode="decimal" value="${s.pay}" aria-label="أجر المندوب"></div><div class="inl"><input id="km" inputmode="decimal" value="${KM()}" aria-label="زيادة كل كم"></div><p style="margin-top:8px">الأول: أجرة التوصيل على المحل (لحد 1 كم). التاني: أجر المندوب. التالت: الزيادة عن كل كم بعد أول كم (بتتضاف على المحل وعلى المندوب).</p><button class="btn" data-a="prices">حفظ الأسعار</button></section>
      <section class="card"><h2>حساب المناديب</h2><div class="list">${cs.length?cs.map(c=>{const d=done.filter(o=>o.courier===c.id),cod=sum(d,o=>o.v),py=d.length*s.pay;return `<div class="order"><div class="r1"><b>${esc(c.name)}</b><span class="st s-done">${d.length} توصيلة</span></div><small>تحصيل: ${money(cod)} • أجره: ${money(py)}</small><small><b>يسلّم للإدارة: ${money(cod-py)}</b></small></div>`}).join(''):empty}</div></section>
      <section class="card"><h2>حساب المحلات</h2><div class="list">${us.filter(u=>u.role==='shop').map(u=>{const d=done.filter(o=>o.shop===u.id),cod=sum(d,o=>o.v),f=sum(d,o=>o.fee||s.fee);return `<div class="order"><div class="r1"><b>${esc(u.name)}</b><span class="st s-done">${d.length} طلب</span></div><small>تحصيل: ${money(cod)} • أجرة التوصيل: ${money(f)}</small><small><b>صافي المحل: ${money(cod-f)}</b></small></div>`}).join('')||empty}</div></section>`}
    if(tab==='returns')body=`<section class="card"><h2>المرتجعات (${rt.length})</h2><div class="list">${rt.length?rt.map(o=>card(o,o.s==='returned'?B('retok',o.id,'تأكيد المرتجع','ok')+B('retno',o.id,'رفض (تم التوصيل)'):'')).join(''):empty}</div></section>`;
    if(tab==='support')body=`<section class="card"><h2>طلبات الدعم</h2><div class="list">${tickets(tk,true)}</div></section>`;
    A.innerHTML=head('لوحة الإدارة')+`<div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-i="${t[0]}">${t[1]}</button>`).join('')}</div>`+body;
  }
}
// ===== حساب الأجرة =====
async function calcFee(){const k=++feeTok,box=$('#feeBox');if(!box||!pick||!me.loc)return;ordDk=null;box.textContent='بنحسب المسافة…';
  let d=km(me.loc,pick)*1.3;
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),7000);const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+me.loc.lng+','+me.loc.lat+';'+pick.lng+','+pick.lat+'?overview=false',{signal:c.signal});clearTimeout(to);const j=await r.json();if(j.routes&&j.routes[0])d=j.routes[0].distance/1000}catch(e){}
  if(k!==feeTok)return;ordDk=Math.round(d*100)/100;const f=feeOf(ordDk);
  box.innerHTML='المسافة '+ordDk.toFixed(1)+' كم • أجرة التوصيل <b>'+f.fee+' ج.م</b>'+(f.ex?' (منها '+f.ex+' ج.م مسافة زيادة)':'')}
// ===== خريطة الطريق =====
const OSM='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
function navOpen(o,c){const D=o&&(c?o.dl:o.sl);if(!D)return toast(c?'موقع العميل مش متسجل':'موقع المحل مش متسجل');if(!window.L)return toast('الخريطة محتاجة إنترنت');
  navOn=o;navTo=!!c;navFit=false;navAt=0;navPos=null;nme=null;nline=null;navEta='';
  $('#nav').classList.remove('hide');$('#nt').textContent=c?'الطريق للعميل: '+o.n:'الطريق لـ '+(o.shopName||'المحل');$('#ni').textContent='بنحدد موقعك…';
  try{nmap&&nmap.remove()}catch(e){}
  nmap=L.map('nmap',{zoomControl:false}).setView([D.lat,D.lng],15);
  L.tileLayer(OSM,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(nmap);
  L.marker([D.lat,D.lng]).addTo(nmap).bindTooltip(c?'👤 '+o.n:'🏪 '+(o.shopName||'المحل'),{permanent:true,direction:'top'});
  if(!myPos&&watchId==null)track();
  setTimeout(()=>{nmap.invalidateSize();navUpdate()},120)}
function navClose(){navOn=null;const n=$('#nav');if(n)n.classList.add('hide');try{nmap&&nmap.remove()}catch(e){}nmap=null}
async function navUpdate(){if(!navOn||!nmap)return;const o=navOn,D=navTo?o.dl:o.sl;
  if(!myPos){$('#ni').textContent=locMsg();return}
  const d=km(myPos,D)*1000;
  if(!nme)nme=L.circleMarker([myPos.lat,myPos.lng],{radius:9,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(nmap);else nme.setLatLng([myPos.lat,myPos.lng]);
  if(d<40){$('#ni').textContent=navTo?'✅ وصلت للعميل':'✅ وصلت المحل';if(nline){nmap.removeLayer(nline);nline=null}return}
  $('#ni').textContent='باقي حوالي '+(d>=1000?(d/1000).toFixed(1)+' كم':Math.round(d)+' م')+(navEta?' • '+navEta:'');
  const n=Date.now();if(navPos&&km(navPos,myPos)<0.04&&n-navAt<60000)return;
  navAt=n;navPos={lat:myPos.lat,lng:myPos.lng};
  let pts=[[myPos.lat,myPos.lng],[D.lat,D.lng]],dash='8 8';
  try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);
    const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+myPos.lng+','+myPos.lat+';'+D.lng+','+D.lat+'?overview=full&geometries=geojson',{signal:c.signal});clearTimeout(tm);
    const j=await r.json();if(j.routes&&j.routes[0]){pts=j.routes[0].geometry.coordinates.map(q=>[q[1],q[0]]);dash=null;navEta='حوالي '+Math.max(1,Math.round(j.routes[0].duration/60))+' دقيقة'}}catch(e){navEta=''}
  if(!navOn||!nmap)return;
  if(nline)nmap.removeLayer(nline);
  nline=L.polyline(pts,{color:'#2563eb',weight:6,opacity:.85,dashArray:dash}).addTo(nmap);
  if(!navFit){nmap.fitBounds(nline.getBounds(),{padding:[50,50]});navFit=true}}
// sheets
function sheet(f,h,m,c){pinCb=null;ordDk=null;feeTok++;const s=$('#sh');s.dataset.f=f;s.innerHTML=h+'<p class="err" id="oerr" role="alert"></p><button class="btn">تأكيد</button><button type="button" class="link" data-a="close" style="width:100%;text-align:center;margin-top:6px">إلغاء</button>';$('#bg').classList.add('on');if(m!==undefined)initPick(m,c)}
const F=(id,l,ph,x='')=>`<label for="${id}">${l}</label><div class="field"><input id="${id}" name="${id}" placeholder="${ph}" ${x}></div>`;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,o=C.orders.find(x=>x.id==i);
  if(a==='logout')logout();
  if(a==='close')$('#bg').classList.remove('on');
  if(a==='tab'){tab=i;render();scrollTo(0,0)}
  if(a==='avail'){avail=!avail;render()}
  if(a==='new'){if(!navigator.onLine)return toast('مفيش اتصال بالإنترنت');if(!me.loc)return toast('حدد موقع المحل الأول');sheet('order','<h3>طلب مندوب جديد</h3>'+F('n','اسم العميل','مثال: أحمد محمد')+F('p','موبايل العميل','01xxxxxxxxx','dir="ltr" inputmode="numeric" maxlength="11"')+F('a','عنوان التوصيل','الشارع، المنطقة، علامة مميزة')+'<label for="z">حجم الأوردر</label><div class="field"><select id="z" name="z">'+Object.keys(SZ).map(k=>`<option value="${k}">${SZD[k]}</option>`).join('')+'</select></div>'+F('v','المبلغ المطلوب تحصيله (ج.م)','0','dir="ltr" inputmode="decimal"')+'<label for="x">ملاحظات</label><textarea id="x" name="x" placeholder="اختياري"></textarea>'+pickHtml('موقع العميل على الخريطة','حرّك الدبوس لمكان تسليم الطلب بالظبط',false)+'<div id="feeBox" class="feebox">حدد موقع العميل علشان تتحسب الأجرة</div>',null,me.loc);pinCb=calcFee}
  if(a==='ticket')sheet('ticket','<h3>طلب دعم</h3><label for="tx">اكتب مشكلتك</label><textarea id="tx" name="tx" placeholder="مثال: المندوب اتأخر على طلب رقم..."></textarea>');
  if(a==='newuser')sheet('user','<h3>حساب جديد</h3><label for="r">النوع</label><div class="field"><select id="r" name="r"><option value="shop">محل</option><option value="courier">مندوب</option></select></div>'+F('un','الاسم','اسم المحل أو المندوب')+F('up','رقم الموبايل','01xxxxxxxxx','dir="ltr" inputmode="numeric" maxlength="11"')+F('uw','كلمة المرور','6 أحرف على الأقل','type="text" dir="ltr"')+vehHtml()+pickHtml(),null);
  if(a==='gps')gps();
  if(a==='myloc'){locFor=me.id;sheet('loc','<h3>موقع المحل</h3><p class="sub" style="margin:4px 0 0">قف في المحل واضغط "موقعي الحالي" أو حرّك الدبوس. بعد التأكيد مش هتقدر تغيّره غير من الإدارة.</p>'+pickHtml(),null)}
  if(a==='editloc'){const u=C.users.find(x=>x.id===i);locFor=i;sheet('loc','<h3>موقع '+esc(u.name)+'</h3>'+pickHtml(),u.loc||null)}
  if(a==='cycveh'){const u=C.users.find(x=>x.id===i),k=Object.keys(VH),n=k[(k.indexOf(u.veh)+1)%k.length];db.collection('users').doc(i).update({veh:n}).catch(werr)}
  if(a==='cancel'&&confirm('تأكيد إلغاء الطلب؟'))put('orders',{...o,s:'cancel'});
  if(a==='acc'){if(o.s!=='search')return toast('الطلب اتاخد من مندوب تاني');put('orders',{...o,s:'assigned',courier:me.id,courierName:me.name});toast('تم قبول الطلب');navOpen(o)}
  if(a==='nav')navOpen(o);
  if(a==='navx')navClose();
  if(a==='go'){put('orders',{...o,s:'way'});if(o.dl)navOpen(o,true)}
  if(a==='navc')navOpen(o,true);
  if(a==='done')put('orders',{...o,s:'done'});
  if(a==='ret'&&confirm('تسجيل الطلب كمرتجع؟'))put('orders',{...o,s:'returned'});
  if(a==='retok')put('orders',{...o,s:'retok'});
  if(a==='retno')put('orders',{...o,s:'done'});
  if(a==='assign'){const c=C.users.find(u=>u.id===$('#c'+i).value);put('orders',{...o,s:'assigned',courier:c.id,courierName:c.name})}
  if(a==='deluser'&&confirm('حذف الحساب؟'))del('users',i);
  if(a==='prices'){const f=+$('#fee').value,p=+$('#pay').value,k=+$('#km').value;if(!(f>=0&&p>=0&&k>=0))return toast('اكتب أرقام صحيحة');put('settings',{id:'main',fee:f,pay:p,km:k});toast('تم حفظ الأسعار')}
  if(a==='reply'){const r=$('#r'+i).value.trim();if(!r)return toast('اكتب الرد الأول');put('tickets',{...C.tickets.find(k=>k.id==i),reply:r,open:false})}
});
$('#sh').onsubmit=async e=>{e.preventDefault();const f=e.target.dataset.f,v=n=>{const t=(e.target.elements[n]?.value||'').trim();return n==='up'?nd(t):t},er=m=>($('#oerr').textContent=m,0);
  if(f==='order'){if(v('n').length<2)return er('اكتب اسم العميل');if(!RX.test(v('p')))return er('رقم موبايل العميل غير صحيح');if(v('a').length<5)return er('اكتب عنوان التوصيل بالتفصيل');if(v('v')&&isNaN(+v('v')))return er('المبلغ لازم يكون رقم');if(!pick)return er('حدد موقع العميل على الخريطة');if(ordDk==null)return er('استنى لحظة لحد ما الأجرة تتحسب');
    put('orders',{id:Date.now(),n:v('n'),p:v('p'),a:v('a'),v:v('v'),x:v('x'),z:v('z')||'s',sl:me.loc||null,s:'search',t:Date.now(),fee:feeOf(ordDk).fee,ex:feeOf(ordDk).ex,dk:ordDk,dl:pick,shop:me.id,shopName:me.name,courier:null});toast('تم تسجيل الطلب، بندوّر على مندوب')}
  if(f==='loc'){if(!pick)return er('حدد الموقع على الخريطة');try{await db.collection('users').doc(locFor).update({loc:pick});if(locFor===me.id){me.loc=pick;render()}toast('تم حفظ الموقع')}catch(x){return er('تعذر الحفظ ('+(x.code||'?')+')')}}
  if(f==='ticket'){if(v('tx').length<5)return er('اكتب تفاصيل المشكلة');put('tickets',{id:Date.now(),uid:me.id,role:me.role,name:me.name,text:v('tx'),reply:'',open:true,t:Date.now()});toast('وصلت الإدارة، هنرد عليك')}
  if(f==='user'){if(v('un').length<2)return er('اكتب الاسم');if(!RX.test(v('up')))return er('رقم الموبايل غير صحيح');if(v('uw').length<6)return er('كلمة المرور 6 أحرف على الأقل');if(v('r')==='shop'&&!pick)return er('حدد موقع المحل على الخريطة');
    if(busy)return;busy=true;
    try{const cr=await sec.auth().createUserWithEmailAndPassword(v('up')+DOMAIN,v('uw'));const uid=cr.user.uid;await sec.auth().signOut();
      await db.collection('users').doc(uid).set({id:uid,role:v('r'),name:v('un'),phone:v('up'),...(v('r')==='shop'?{loc:pick}:{veh:v('vh')||'moto'}),t:Date.now()});toast('تم إنشاء الحساب')}
    catch(x){busy=false;return er(x.code==='auth/email-already-in-use'?'الرقم ده متسجّل قبل كده. لو اتحذف، امسحه من Firebase Authentication الأول':x.code==='permission-denied'?'مش مسموحلك (قواعد Firestore)':x.code==='auth/weak-password'||x.code==='auth/password-does-not-meet-requirements'?'كلمة المرور ضعيفة، اكتب 6 أحرف أو أكتر':x.code==='auth/admin-restricted-operation'||x.code==='auth/operation-not-allowed'?'إنشاء الحسابات متقفّل في Firebase. فعّل Enable create (sign-up) من Authentication ثم Settings':'تعذر إنشاء الحساب ('+(x.code||x.message||'?')+')')}
    busy=false}
  $('#bg').classList.remove('on')};
$('#bg').onclick=e=>{if(e.target.id==='bg')$('#bg').classList.remove('on')};
$('#sh').addEventListener('change',e=>{if(e.target.id!=='r')return;const s=e.target.value==='shop';$('#shopLoc').classList.toggle('hide',!s);$('#vehBox').classList.toggle('hide',s);if(s&&pmap)setTimeout(()=>pmap.invalidateSize(),60)});
addEventListener('online',render);addEventListener('offline',render);
if(READY){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();sec=firebase.initializeApp(firebaseConfig,'sec');auth.onAuthStateChanged(onUser)}
else $('#err').textContent='إعدادات Firebase لسه متحطتش في الملف';
